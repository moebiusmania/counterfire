<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The social share card (og:image). Rendered to og-image.png by tools/og-image.ts. -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1d26"/>
      <stop offset="1" stop-color="#1a4152"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080c0a" stop-opacity=".94"/>
      <stop offset=".45" stop-color="#080c0a" stop-opacity=".8"/>
      <stop offset=".62" stop-color="#080c0a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blast">
      <stop offset="0" stop-color="#fff6c0"/>
      <stop offset=".35" stop-color="#f5b52e"/>
      <stop offset=".7" stop-color="#d8473a" stop-opacity=".7"/>
      <stop offset="1" stop-color="#d8473a" stop-opacity="0"/>
    </radialGradient>
    <g id="tree">
      <circle r="17" fill="#1a5a1e"/>
      <circle cx="-3" cy="-3" r="10" fill="#236b26"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#sea)"/>
  <g stroke="#2b5a6c" stroke-width="2" fill="none" stroke-linecap="round" opacity=".6">
    <path d="M480 90q20-8 40 0t40 0"/>
    <path d="M520 540q20-8 40 0t40 0"/>
    <path d="M420 300q20-8 40 0t40 0"/>
  </g>

  <!-- the island: sand round the edge, grass inside -->
  <path d="M640 20 C820 -10 1060 0 1230 30 L1230 640 L560 640 C520 560 600 500 570 420 C540 330 620 280 600 190 C585 110 580 40 640 20Z" fill="#d1bf85"/>
  <path d="M672 50 C840 25 1060 30 1230 58 L1230 640 L612 640 C580 570 640 510 612 420 C585 335 660 285 640 195 C628 125 620 70 672 50Z" fill="#578c38"/>

  <!-- road from the bunker up to the enemy compound -->
  <path d="M700 640 C720 520 760 470 860 420 S1000 330 1050 180" fill="none" stroke="#5e584c" stroke-width="34"/>
  <path d="M700 640 C720 520 760 470 860 420 S1000 330 1050 180" fill="none" stroke="#787161" stroke-width="26"/>

  <!-- forests -->
  <use href="#tree" x="700" y="120"/><use href="#tree" x="732" y="96"/><use href="#tree" x="716" y="156"/>
  <use href="#tree" x="760" y="140"/><use href="#tree" x="690" y="200"/><use href="#tree" x="1150" y="300"/>
  <use href="#tree" x="1180" y="340"/><use href="#tree" x="1130" y="350"/><use href="#tree" x="1170" y="390"/>
  <use href="#tree" x="660" y="330"/><use href="#tree" x="690" y="360"/><use href="#tree" x="940" y="560"/>
  <use href="#tree" x="975" y="585"/><use href="#tree" x="1010" y="560"/><use href="#tree" x="1160" y="600"/>

  <!-- enemy compound: walls, a flag tower flying the CPU's red flag, a turret -->
  <rect x="980" y="60" width="160" height="130" fill="none" stroke="#7d786a" stroke-width="14"/>
  <rect x="1060" y="90" width="50" height="50" fill="#b9b1a0"/>
  <path d="M1060 90h50l-25 25z" fill="#a8281f"/><path d="M1110 140h-50l25-25z" fill="#cc3326"/>
  <rect x="1083" y="54" width="4" height="40" fill="#1e1f18"/>
  <path d="M1087 56h30l-8 9 8 9h-30z" fill="#cc3326"/>
  <circle cx="1010" cy="250" r="22" fill="#6a6a62"/>
  <circle cx="1010" cy="250" r="13" fill="#cc3326"/>
  <circle cx="1010" cy="250" r="44" fill="url(#blast)"/>

  <!-- player 1's bunker -->
  <circle cx="700" cy="560" r="44" fill="#808079"/>
  <circle cx="700" cy="560" r="30" fill="#5a5a54" stroke="#d9bf33" stroke-width="6"/>

  <!-- the jeep -->
  <g transform="translate(780 255) rotate(25)">
    <rect x="-16" y="-24" width="7" height="12" rx="2" fill="#1e1f18"/><rect x="9" y="-24" width="7" height="12" rx="2" fill="#1e1f18"/>
    <rect x="-16" y="12" width="7" height="12" rx="2" fill="#1e1f18"/><rect x="9" y="12" width="7" height="12" rx="2" fill="#1e1f18"/>
    <rect x="-12" y="-28" width="24" height="56" rx="5" fill="#5f6b3c"/>
    <rect x="-9" y="-10" width="18" height="6" fill="#d9bf33"/>
  </g>

  <!-- the tank in the gunsight, firing at the turret -->
  <path d="M905 357 L996 262" stroke="#fff3b0" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(870 395) rotate(44)">
    <rect x="-38" y="-46" width="20" height="92" rx="5" fill="#1e1f18"/>
    <rect x="18" y="-46" width="20" height="92" rx="5" fill="#1e1f18"/>
    <rect x="-26" y="-40" width="52" height="80" rx="8" fill="#56603a"/>
    <rect x="-26" y="28" width="52" height="8" fill="#d9bf33"/>
    <rect x="-5" y="-84" width="10" height="70" rx="3" fill="#33391f"/>
    <circle r="20" fill="#6b7747"/>
  </g>
  <g fill="none" stroke="#e8d23a" stroke-width="5" stroke-linecap="round">
    <circle cx="870" cy="395" r="86"/>
    <path d="M870 291v24M870 475v24M766 395h24M950 395h24"/>
  </g>

  <!-- the helicopter, rotor turning -->
  <g transform="translate(1075 470) rotate(-30)">
    <rect x="-5" y="20" width="10" height="70" rx="3" fill="#4b5431"/>
    <rect x="-18" y="80" width="36" height="6" rx="2" fill="#1e1f18"/>
    <ellipse rx="22" ry="38" fill="#5f6b3c"/>
    <ellipse cy="-20" rx="14" ry="14" fill="#33424a"/>
    <circle r="78" fill="#c9cfc0" opacity=".16"/>
    <path d="M-76 -12L76 12M-12 76L12 -76" stroke="#1e1f18" stroke-width="7" stroke-linecap="round" opacity=".75"/>
    <circle r="6" fill="#1e1f18"/>
  </g>

  <!-- the words -->
  <rect width="1200" height="630" fill="url(#shade)"/>
  <g font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-weight="bold">
    <text x="64" y="214" font-size="88" fill="#000">COUNTERFIRE</text>
    <text x="60" y="210" font-size="88" fill="#e8d23a">COUNTERFIRE</text>
    <text x="62" y="282" font-size="34" fill="#e7e2c4">Find and capture the enemy flag.</text>
    <text x="62" y="350" font-size="23" fill="#9a9677">TANK · ASV · HELICOPTER · JEEP</text>
    <text x="62" y="392" font-size="23" fill="#9a9677">1 OR 2 PLAYERS · 72 MAPS · LEVEL EDITOR</text>
    <rect x="62" y="470" width="404" height="64" fill="#4a5a2a" fill-opacity=".9" stroke="#e8d23a" stroke-width="3"/>
    <text x="264" y="512" font-size="26" fill="#fff" text-anchor="middle">PLAY IN YOUR BROWSER</text>
  </g>
</svg>
